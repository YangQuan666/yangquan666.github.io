name: Build and Deploy
on:
  push:
    branches:
      - v3
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Build
        run: |
          npm install
          npm run docs:build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          BRANCH: gh-pages
          FOLDER: .vitepress/dist
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}